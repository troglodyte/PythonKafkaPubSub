  student_repository.py: "# student_repository.py\nfrom sqlalchemy.orm import Session\nfrom sqlalchemy.exc import SQLAlchemyError\nfrom database import SessionLocal\nfrom models import Student\nfrom typing import List, Optional\n\n\nclass StudentRepository:\n    \"\"\"Repository for Student CRUD operations\"\"\"\n    \n    @staticmethod\n    def create_student(student_data: dict) -> Optional[Student]:\n        \"\"\"Create a new student\"\"\"\n        db = SessionLocal()\n        try:\n            student = Student(**student_data)\n            db.add(student)\n            db.commit()\n            db.refresh(student)\n            print(f\"Created student: {student}\")\n            return student\n        except SQLAlchemyError as e:\n            db.rollback()\n            print(f\"Error creating student: {e}\")\n            return None\n        finally:\n            db.close()\n    \n    @staticmethod\n    def get_student_by_id(student_id: int) -> Optional[Student]:\n        \"\"\"Get a student by ID\"\"\"\n        db = SessionLocal()\n        try:\n            return db.query(Student).filter(Student.id == student_id).first()\n        finally:\n            db.close()\n    \n    @staticmethod\n    def get_student_by_email(email: str) -> Optional[Student]:\n        \"\"\"Get a student by email\"\"\"\n        db = SessionLocal()\n        try:\n            return db.query(Student).filter(Student.email == email).first()\n        finally:\n            db.close()\n    \n    @staticmethod\n    def get_all_students(skip: int = 0, limit: int = 100) -> List[Student]:\n        \"\"\"Get all students with pagination\"\"\"\n        db = SessionLocal()\n        try:\n            return db.query(Student).offset(skip).limit(limit).all()\n        finally:\n            db.close()\n    \n    @staticmethod\n    def update_student(student_id: int, update_data: dict) -> Optional[Student]:\n        \"\"\"Update a student\"\"\"\n        db = SessionLocal()\n        try:\n            student = db.query(Student).filter(Student.id == student_id).first()\n            if student:\n                for key, value in update_data.items():\n                    if hasattr(student, key):\n                        setattr(student, key, value)\n                db.commit()\n                db.refresh(student)\n                print(f\"Updated student: {student}\")\n                return student\n            return None\n        except SQLAlchemyError as e:\n            db.rollback()\n            print(f\"Error updating student: {e}\")\n            return None\n        finally:\n            db.close()\n    \n    @staticmethod\n    def delete_student(student_id: int) -> bool:\n        \"\"\"Delete a student\"\"\"\n        db = SessionLocal()\n        try:\n            student = db.query(Student).filter(Student.id == student_id).first()\n            if student:\n                db.delete(student)\n                db.commit()\n                print(f\"Deleted student ID: {student_id}\")\n                return True\n            return False\n        except SQLAlchemyError as e:\n            db.rollback()\n            print(f\"Error deleting student: {e}\")\n            return False\n        finally:\n            db.close()\n    \n    @staticmethod\n    def bulk_create_students(students_data: List[dict]) -> bool:\n        \"\"\"Bulk create students\"\"\"\n        db = SessionLocal()\n        try:\n            students = [Student(**data) for data in students_data]\n            db.bulk_save_objects(students)\n            db.commit()\n            print(f\"Bulk created {len(students)} students\")\n            return True\n        except SQLAlchemyError as e:\n            db.rollback()\n            print(f\"Error bulk creating students: {e}\")\n            return False\n        finally:\n            db.close()\n\n\n# Example usage\nif __name__ == \"__main__\":\n    repo = StudentRepository()\n    \n    # Create a student\n    student_data = {\n        \"first_name\": \"John\",\n        \"last_name\": \"Doe\",\n        \"email\": \"john.doe@example.com\",\n        \"age\": 20,\n        \"grade\": 3.8,\n        \"phone\": \"+1234567890\"\n    }\n    \n    student = repo.create_student(student_data)\n    \n    if student:\n        print(f\"Created student with ID: {student.id}\")\n        \n        # Get the student\n        retrieved = repo.get_student_by_id(student.id)\n        print(f\"Retrieved: {retrieved}\")\n        \n        # Update the student\n        updated = repo.update_student(student.id, {\"grade\": 3.9})\n        print(f\"Updated: {updated}\")\n        \n        # Get all students\n        all_students = repo.get_all_students()\n        print(f\"Total students: {len(all_students)}\")"
