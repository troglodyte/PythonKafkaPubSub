  kafka_consumer.py: "from kafka import KafkaConsumer\nimport json\nfrom constants import STUDENT_QUEUE, QUEUE_URL\nfrom multiprocessing import Pool, cpu_count\nimport signal\nimport sys\n\n\nclass KafkaMessageConsumer:\n    def __init__(self, num_workers=None):\n        self.consumer = None\n        self.pool = None\n        self.num_workers = num_workers or cpu_count()\n\n    def initialize_consumer(self):\n        self.consumer = KafkaConsumer(\n            STUDENT_QUEUE,\n            bootstrap_servers=[QUEUE_URL],\n            auto_offset_reset='earliest',  \n            enable_auto_commit=True,\n            group_id='my-consumer-group',\n            value_deserializer=lambda m: json.loads(m.decode('utf-8'))\n        )\n        # Initialize process pool\n        self.pool = Pool(processes=self.num_workers)\n\n    @staticmethod\n    def process_message(message_data):\n        \"\"\"Static method to process message - must be picklable\"\"\"\n        topic, partition, offset, key, value = message_data\n        print(f\"Topic: {topic}\")\n        print(f\"Partition: {partition}\")\n        print(f\"Offset: {offset}\")\n        print(f\"Key: {key}\")\n        print(f\"Value: {value}\")\n        print(\"-\" * 50)\n        # Add your processing logic here\n        return f\"Processed message at offset {offset}\"\n\n    def start_consuming(self):\n        print(f\"Starting consumer with {self.num_workers} workers...\")\n        try:\n            for message in self.consumer:\n                # Extract message data as tuple\n                message_data = (\n                    message.topic,\n                    message.partition,\n                    message.offset,\n                    message.key,\n                    message.value\n                )\n                # Submit to process pool (async)\n                self.pool.apply_async(\n                    self.process_message,\n                    args=(message_data,),\n                    error_callback=lambda e: print(f\"Error: {e}\")\n                )\n        except KeyboardInterrupt:\n            print(\"\\nConsumer stopped\")\n        finally:\n            self.close()\n\n    def close(self):\n        if self.pool:\n            self.pool.close()\n            self.pool.join()\n        if self.consumer:\n            self.consumer.close()\n\n\nif __name__ == \"__main__\":\n    consumer = KafkaMessageConsumer(num_workers=4)\n    consumer.initialize_consumer()\n    consumer.start_consuming()\n"
  kafka_producer.py: |-
    from kafka import KafkaProducer
    import json
    import time

    producer = KafkaProducer(
        bootstrap_servers=['localhost:9092'],
        value_serializer=lambda v: json.dumps(v).encode('utf-8')
    )

    def send_message(topic, message):
        try:
            future = producer.send(topic, message)
            record_metadata = future.get(timeout=10)
            print(f"Message sent to {record_metadata.topic} partition {record_metadata.partition} offset {record_metadata.offset}")
        except Exception as e:
            print(f"Error sending message: {e}")

    if __name__ == "__main__":
        for i in range(10):
            message = {
                'id': i,
                'timestamp': time.time(),
                'data': f'Message {i}'
            }
            send_message('students', message)
        producer.close()
  logfactory.py: |-
    import structlog
    import logging
    import sys

    def configure_logging(use_json: bool = True):
        logging.basicConfig(
            format="%(message)s",
            stream=sys.stdout,
            level=logging.INFO,
        )

        if use_json:
            renderer = structlog.processors.JSONRenderer()
        else:
            renderer = structlog.dev.ConsoleRenderer(colors=True)

        structlog.configure(
            processors=[
                structlog.stdlib.add_log_level,
                structlog.processors.TimeStamper(fmt="iso"),
                structlog.stdlib.add_logger_name,
                structlog.processors.StackInfoRenderer(),
                structlog.processors.format_exc_info,
                structlog.stdlib.ProcessorFormatter.wrap_for_formatter,
                renderer,
            ],
            wrapper_class=structlog.stdlib.BoundLogger,
            context_class=dict,
            logger_factory=structlog.stdlib.LoggerFactory(),
            cache_logger_on_first_use=True,
        )

    def get_logger(name: str = None):
        """Get a configured logger instance"""
        return structlog.get_logger(name)
  models.py: |-
    # models.py
    from sqlalchemy import Column, Integer, String, DateTime, Float, Boolean
    from sqlalchemy.sql import func
    from database import Base


    class Student(Base):
        __tablename__ = "students"

        # Primary key
        id = Column(Integer, primary_key=True, index=True, autoincrement=True)

        # Student information
        first_name = Column(String(100), nullable=False)
        last_name = Column(String(100), nullable=False)
        email = Column(String(255), unique=True, index=True, nullable=False)
        age = Column(Integer)
        grade = Column(Float)
        phone = Column(String(20))
        address = Column(String(500))
        is_active = Column(Boolean, default=True)

        # Timestamps
        created_at = Column(DateTime(timezone=True), server_default=func.now())
        updated_at = Column(DateTime(timezone=True), onupdate=func.now())

        def __repr__(self):
            return f"<Student(id={self.id}, name='{self.first_name} {self.last_name}', email='{self.email}')>"

        def to_dict(self):
            """Convert model to dictionary"""
            return {
                'id': self.id,
                'first_name': self.first_name,
                'last_name': self.last_name,
                'email': self.email,
                'age': self.age,
                'grade': self.grade,
                'phone': self.phone,
                'address': self.address,
                'is_active': self.is_active,
                'created_at': self.created_at.isoformat() if self.created_at else None,
                'updated_at': self.updated_at.isoformat() if self.updated_at else None
            }
