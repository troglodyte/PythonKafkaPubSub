  docker-compose.yml: |2+
    services:
      zookeeper:
        image: confluentinc/cp-zookeeper:latest
        container_name: zookeeper
        environment:
          ZOOKEEPER_CLIENT_PORT: 2181
        ports:
          - "2181:2181"

      postgres:
        image: postgres:latest
        container_name: postgres
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mydb
        ports:
          - "5432:5432"
        volumes:
          - postgres_data:/var/lib/postgresql


      rabbitmq:
        image: rabbitmq:3-management
        container_name: rabbitmq
        ports:
          - "5672:5672"   # AMQP protocol port
          - "15672:15672" # Management interface port
        environment:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        healthcheck:
          test: [ "CMD", "rabbitmqctl", "status" ]
          interval: 30s
          timeout: 10s
          retries: 5


      kafka:
        image: confluentinc/cp-kafka:latest
        container_name: kafka
        ports:
          - "9092:9092"
        environment:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      pyserver:
        image: python:3.13.5-slim
        container_name: pyserver
        working_dir: /app
        volumes:
          - .:/app
        ports:
          - "8000:8000"
        depends_on:
          - kafka
          - postgres
        command: python -m http.server 8000

    volumes:
      postgres_data:

  git-test-not-blocking-faster.py: |
    import time
    from concurrent.futures import ProcessPoolExecutor

    def cpu_heavy(n):
        total = 0
        for i in range(10_000_000):
            total += i * n
        return total

    # Runs multiple processes in parallel
    if __name__ == "__main__":  # ← This is crucial!
        start = time.time()
        with ProcessPoolExecutor(max_workers=8) as executor:
            results = list(executor.map(cpu_heavy, [1, 2, 3, 4]))
        print(f"Processes took {time.time() - start:.2f} seconds")
